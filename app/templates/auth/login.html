{% extends "base.html" %}{% from "_macros.html" import field %}
{% block content %}
<div class="card"><div class="card-body p-4">
  <div class="text-center mb-4"><i class="bi bi-shield-check display-5" style="color:var(--teal)"></i>
    <h4 class="mt-2 mb-0" style="color:var(--navy)">Visitor &amp; Gate Pass</h4><div class="text-muted small">{{ org_name }}</div></div>
  <form method="post" novalidate>{{ form.hidden_tag() }}
    {{ field(form.email) }}{{ field(form.password) }}{{ field(form.remember) }}
    <button class="btn btn-primary w-100">Sign in</button>
  </form>
  <div class="text-center mt-3"><a href="{{ url_for('auth.forgot') }}" class="small">Forgot password?</a></div>
</div></div>
{% endblock %}
