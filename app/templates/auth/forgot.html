{% extends "base.html" %}{% from "_macros.html" import field %}
{% block content %}
<div class="card"><div class="card-body p-4"><h5>Reset your password</h5>
  <p class="text-muted small">Enter your account email. If it exists we will send a reset link valid for 1 hour.</p>
  <form method="post" novalidate>{{ form.hidden_tag() }}{{ field(form.email) }}
    <button class="btn btn-primary w-100">Send reset link</button></form>
  <div class="text-center mt-3"><a href="{{ url_for('auth.login') }}" class="small">Back to sign in</a></div></div></div>
{% endblock %}
