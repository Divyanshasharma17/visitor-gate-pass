{% extends "base.html" %}{% from "_macros.html" import field %}
{% set title = 'Change password' %}{% set crumbs = [('Change password', None)] %}
{% block content %}
<div class="card" style="max-width:480px"><div class="card-header">Change password</div><div class="card-body">
  <form method="post" novalidate>{{ form.hidden_tag() }}{{ field(form.current) }}{{ field(form.password) }}{{ field(form.confirm) }}
    <button class="btn btn-primary">Save</button></form></div></div>
{% endblock %}
